<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理後台</title>

    <link rel="stylesheet" href="/assets/css/global.css" defer />
    <link rel="stylesheet" href="/assets/css/dashboard.css" defer />

    <link
      rel="preload"
      href="/assets/font/InterVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/assets/font/Consolas.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <!-- ===== 導覽列 ===== -->
    <nav class="app-nav">
      <div class="app-nav-inner">
        <div class="nav-lft">
          <a class="app-nav-link-button-s-1 user-select-none cursor-pointer" href="/index">Back</a>
          <a class="nav-link-a user-select-none cursor-pointer" href="/docs?doc=intro">Docs</a>
          <a class="nav-link-a user-select-none cursor-pointer" href="/demo">Demo</a>
        </div>
        <div class="nav-rgt">
          <span id="nav-username" class="nav-link-a user-select-none"></span>
          <button id="btn-logout" class="app-nav-link-button-s-1 cursor-pointer">Sign out</button>
        </div>
      </div>
    </nav>

    <!-- ===== 主內容 ===== -->
    <main class="app">
      <div class="top-content">
        <div class="dash-content">

          <!-- 頁面標題 -->
          <div class="dash-header">
            <h1 class="dash-title">管理後台</h1>
            <p class="dash-subtitle">即時監控司機疲勞警告事件</p>
          </div>

          <!-- 統計卡片列 -->
          <div class="stat-cards">
            <div class="stat-card">
              <div class="stat-label">視窗內警告次數</div>
              <div class="stat-value" id="stat-window-count">—</div>
              <div class="stat-sub" id="stat-window-threshold"></div>
            </div>
            <div class="stat-card" id="escalation-card">
              <div class="stat-label">升級通報狀態</div>
              <div class="stat-value" id="stat-escalated">—</div>
              <div class="stat-sub" id="stat-escalated-sub"></div>
            </div>
            <div class="stat-card">
              <div class="stat-label">顯示筆數</div>
              <div class="stat-value" id="stat-total-db">—</div>
              <div class="stat-sub">最多保留 <span id="stat-max-records">1000</span> 筆</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">資料保留天數</div>
              <div class="stat-value" id="stat-retention">—</div>
              <div class="stat-sub">超過自動刪除</div>
            </div>
          </div>

          <!-- 操作按鈕 -->
          <div class="action-bar">
            <button id="btn-refresh" class="dash-btn dash-btn-default">🔄 重新整理</button>
            <button id="btn-reset"   class="dash-btn dash-btn-warning">⚠️ 重置警報視窗</button>
            <button id="btn-purge"   class="dash-btn dash-btn-danger">🗑️ 清理過期資料</button>
          </div>

          <!-- 狀態訊息 -->
          <div id="action-msg" class="hidden"></div>

          <!-- 警告事件表格 -->
          <div class="table-panel">
            <div class="table-panel-header">
              <span class="table-panel-title">近期警告事件</span>
              <select id="limit-select" class="limit-select">
                <option value="20">顯示 20 筆</option>
                <option value="50" selected>顯示 50 筆</option>
                <option value="100">顯示 100 筆</option>
              </select>
            </div>

            <div class="table-wrapper">
              <table class="alert-table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>時間</th>
                    <th>Session ID</th>
                    <th>原因</th>
                    <th>疲勞分數</th>
                    <th>視窗計數</th>
                    <th>升級通報</th>
                  </tr>
                </thead>
                <tbody id="alert-tbody">
                  <tr><td colspan="7" class="table-empty">載入中…</td></tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </div>

      <!-- ===== Footer ===== -->
      <div class="app-footer user-select-none">
        <div class="footer-top">
          <div class="footer-brand">
            <div class="footer-app-name">
              <span>Face-Detection</span>
              <p>Build with MediaPipe.</p>
            </div>
            <div class="github_repo_link">
              <a
                href="https://github.com/Graduation-Topic/face-detec-co-work/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="GitHub Repository"
              >
                <svg width="24" height="24" viewBox="0 0 98 96" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M41.4395 69.3848C28.8066 67.8535 19.9062 58.7617 19.9062 46.9902C19.9062 42.2051 21.6289 37.0371 24.5 33.5918C23.2559 30.4336 23.4473 23.7344 24.8828 20.959C28.7109 20.4805 33.8789 22.4902 36.9414 25.2656C40.5781 24.1172 44.4062 23.543 49.0957 23.543C53.7852 23.543 57.6133 24.1172 61.0586 25.1699C64.0254 22.4902 69.2891 20.4805 73.1172 20.959C74.457 23.543 74.6484 30.2422 73.4043 33.4961C76.4668 37.1328 78.0937 42.0137 78.0937 46.9902C78.0937 58.7617 69.1934 67.6621 56.3691 69.2891C59.623 71.3945 61.8242 75.9883 61.8242 81.252L61.8242 91.2051C61.8242 94.0762 64.2168 95.7031 67.0879 94.5547C84.4102 87.9512 98 70.6289 98 49.1914C98 22.1074 75.9883 6.69539e-07 48.9043 4.309e-07C21.8203 1.92261e-07 -1.9479e-07 22.1074 -4.3343e-07 49.1914C-6.20631e-07 70.4375 13.4941 88.0469 31.6777 94.6504C34.2617 95.6074 36.75 93.8848 36.75 91.3008L36.75 83.6445C35.4102 84.2188 33.6875 84.6016 32.1562 84.6016C25.8398 84.6016 22.1074 81.1563 19.4277 74.7441C18.375 72.1602 17.2266 70.6289 15.0254 70.3418C13.877 70.2461 13.4941 69.7676 13.4941 69.1934C13.4941 68.0449 15.4082 67.1836 17.3223 67.1836C20.0977 67.1836 22.4902 68.9063 24.9785 72.4473C26.8926 75.2227 28.9023 76.4668 31.2949 76.4668C33.6875 76.4668 35.2187 75.6055 37.4199 73.4043C39.0469 71.7773 40.291 70.3418 41.4395 69.3848Z"/>
                </svg>
              </a>
            </div>
          </div>

          <div class="footer-site">
            <span>Site</span>
            <div class="footer-site-links">
              <a href="/docs?doc=intro">Docs</a>
              <a href="/demo">Demo</a>
            </div>
          </div>
        </div>
        <div class="footer-text">
          <p class="footer-created">Created by</p>
          <p class="footer-name">Liu, Peng</p>
        </div>
      </div>
    </main>

    <script>
      // ===== 工具 =====
      const $  = id => document.getElementById(id);

      function showMsg(text, type) {
        const el = $('action-msg');
        el.textContent = text;
        el.className = `dash-msg dash-msg-${type}`;
        clearTimeout(el._t);
        el._t = setTimeout(() => { el.className = 'hidden'; }, 4500);
      }

      function formatTime(isoStr) {
        if (!isoStr) return '—';
        return new Date(isoStr + 'Z').toLocaleString('zh-TW', { hour12: false });
      }

      function shortId(sid) {
        if (!sid) return '—';
        return sid.length > 14 ? sid.slice(0, 14) + '…' : sid;
      }

      // ===== 資料載入 =====
      async function loadData() {
        const limit = $('limit-select').value;
        try {
          const res = await fetch(`/api/admin/alerts?limit=${limit}`);
          if (res.status === 401) { window.location.href = '/login'; return; }
          const data = await res.json();

          // 統計卡
          const st = data.status || {};
          $('stat-window-count').textContent = st.window_count ?? '—';
          $('stat-window-threshold').textContent =
            `門檻：${st.trigger_count ?? '—'} 次 / ${Math.round((st.window_sec ?? 300) / 60)} 分鐘`;

          const isEsc = !!st.is_escalated;
          $('stat-escalated').textContent = isEsc ? '🚨 已升級' : '✅ 正常';
          $('escalation-card').classList.toggle('stat-card-escalated', isEsc);
          $('stat-escalated-sub').textContent = isEsc ? '已超過門檻，請關注' : '目前無異常升級';

          // 從 config 取保留設定
          try {
            const cfg = await fetch('/api/config').then(r => r.json());
            $('stat-retention').textContent = `${cfg.ALERT_RETENTION_DAYS} 天`;
            $('stat-max-records').textContent = cfg.ALERT_MAX_DB_RECORDS;
          } catch (_) {}

          // 表格
          const alerts = data.recent_alerts || [];
          $('stat-total-db').textContent = alerts.length;
          const tbody = $('alert-tbody');

          if (!alerts.length) {
            tbody.innerHTML = '<tr><td colspan="7" class="table-empty">目前沒有警告事件紀錄</td></tr>';
            return;
          }

          tbody.innerHTML = alerts.map(a => `
            <tr class="${a.is_new_escalation ? 'row-escalated' : ''}">
              <td>${a.id}</td>
              <td>${formatTime(a.created_at)}</td>
              <td title="${a.session_id || ''}">${shortId(a.session_id)}</td>
              <td>${a.reason || '—'}</td>
              <td>${a.score != null ? a.score.toFixed(1) : '—'}</td>
              <td>${a.window_count ?? '—'}</td>
              <td class="${a.is_escalated ? 'cell-danger' : 'cell-ok'}">
                ${a.is_escalated ? '🚨 是' : '正常'}
              </td>
            </tr>
          `).join('');

        } catch (err) {
          showMsg('載入失敗：' + err.message, 'error');
        }
      }

      // ===== 按鈕事件 =====
      $('btn-refresh').addEventListener('click', loadData);
      $('limit-select').addEventListener('change', loadData);

      $('btn-reset').addEventListener('click', async () => {
        if (!confirm('確定要重置警報視窗計數？\n（資料庫紀錄不會刪除）')) return;
        const res = await fetch('/api/admin/alerts/reset', { method: 'POST' });
        if (res.status === 401) { window.location.href = '/login'; return; }
        const d = await res.json();
        showMsg(d.message || '已重置', 'info');
        loadData();
      });

      $('btn-purge').addEventListener('click', async () => {
        if (!confirm('確定要清理過期警告資料？\n超過保留天數的記錄將被永久刪除，此操作無法還原。')) return;
        const res = await fetch('/api/admin/alerts/purge', { method: 'POST' });
        if (res.status === 401) { window.location.href = '/login'; return; }
        const d = await res.json();
        showMsg(d.message || '清理完成', d.status === 'success' ? 'success' : 'error');
        loadData();
      });

      $('btn-logout').addEventListener('click', async () => {
        await fetch('/api/auth/logout', { method: 'POST' });
        window.location.href = '/login';
      });

      // ===== 初始化 =====
      (async () => {
        const me = await fetch('/api/auth/me').then(r => r.json());
        if (!me.logged_in || me.role !== 'admin') { window.location.href = '/login'; return; }
        $('nav-username').textContent = me.display_name || me.username;
        loadData();
        setInterval(loadData, 30000);
      })();
    </script>
  </body>
</html>
