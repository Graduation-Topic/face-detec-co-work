<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登入 — 疲勞偵測系統</title>

    <link rel="stylesheet" href="/assets/css/global.css" />
    <link rel="stylesheet" href="/assets/css/login.css" />

    <link
      rel="preload"
      href="/assets/font/InterVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <nav class="app-nav">
      <div class="app-nav-inner">
        <div class="nav-lft">
          <a class="app-nav-link-button-s-1 user-select-none cursor-pointer" href="/index">Back</a>
          <a class="nav-link-a user-select-none cursor-pointer" href="/docs?doc=intro">Docs</a>
          <a class="nav-link-a user-select-none cursor-pointer" href="/demo">Demo</a>
        </div>
        <div class="nav-rgt">
          <a class="app-nav-link-button-s-1 user-select-none cursor-pointer" href="/login">Sign in</a>
        </div>
      </div>
    </nav>

    <main class="app">
      <div class="top-content">
        <div class="auth-content">

          <!-- 登入卡片 -->
          <div class="login-card">
            <h1 class="login-title">管理員登入</h1>
            <p class="login-subtitle">請輸入您的帳號與密碼以進入後台</p>

            <form id="login-form" class="login-form" autocomplete="off">
              <div class="form-group">
                <label for="inp-username">帳號</label>
                <input
                  id="inp-username"
                  type="text"
                  class="form-input"
                  placeholder="admin"
                  autocomplete="username"
                  required
                />
              </div>

              <div class="form-group">
                <label for="inp-password">密碼</label>
                <input
                  id="inp-password"
                  type="password"
                  class="form-input"
                  placeholder="••••••••"
                  autocomplete="current-password"
                  required
                />
              </div>

              <div id="login-error" class="login-error hidden">帳號或密碼錯誤</div>

              <button type="submit" id="btn-login" class="btn-login">
                <span id="btn-label">登入</span>
                <span id="btn-spinner" class="hidden">⏳</span>
              </button>
            </form>
          </div>

        </div>
      </div>

      <div class="app-footer user-select-none">
        <div class="footer-top">
          <div class="footer-brand">
            <div class="footer-app-name">
              <span>Face-Detection</span>
              <p>Build with MediaPipe.</p>
            </div>

            <div class="github_repo_link">
              <a
                href="https://github.com/Graduation-Topic/face-detec-co-work/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="GitHub Repository"
              >
                <svg width="24" height="24" viewBox="0 0 98 96" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M41.4395 69.3848C28.8066 67.8535 19.9062 58.7617 19.9062 46.9902C19.9062 42.2051 21.6289 37.0371 24.5 33.5918C23.2559 30.4336 23.4473 23.7344 24.8828 20.959C28.7109 20.4805 33.8789 22.4902 36.9414 25.2656C40.5781 24.1172 44.4062 23.543 49.0957 23.543C53.7852 23.543 57.6133 24.1172 61.0586 25.1699C64.0254 22.4902 69.2891 20.4805 73.1172 20.959C74.457 23.543 74.6484 30.2422 73.4043 33.4961C76.4668 37.1328 78.0937 42.0137 78.0937 46.9902C78.0937 58.7617 69.1934 67.6621 56.3691 69.2891C59.623 71.3945 61.8242 75.9883 61.8242 81.252L61.8242 91.2051C61.8242 94.0762 64.2168 95.7031 67.0879 94.5547C84.4102 87.9512 98 70.6289 98 49.1914C98 22.1074 75.9883 6.69539e-07 48.9043 4.309e-07C21.8203 1.92261e-07 -1.9479e-07 22.1074 -4.3343e-07 49.1914C-6.20631e-07 70.4375 13.4941 88.0469 31.6777 94.6504C34.2617 95.6074 36.75 93.8848 36.75 91.3008L36.75 83.6445C35.4102 84.2188 33.6875 84.6016 32.1562 84.6016C25.8398 84.6016 22.1074 81.1563 19.4277 74.7441C18.375 72.1602 17.2266 70.6289 15.0254 70.3418C13.877 70.2461 13.4941 69.7676 13.4941 69.1934C13.4941 68.0449 15.4082 67.1836 17.3223 67.1836C20.0977 67.1836 22.4902 68.9063 24.9785 72.4473C26.8926 75.2227 28.9023 76.4668 31.2949 76.4668C33.6875 76.4668 35.2187 75.6055 37.4199 73.4043C39.0469 71.7773 40.291 70.3418 41.4395 69.3848Z"/>
                </svg>
              </a>
            </div>
          </div>

          <div class="footer-site">
            <span>Site</span>
            <div class="footer-site-links">
              <a href="/docs?doc=intro">Docs</a>
              <a href="/demo">Demo</a>
            </div>
          </div>
        </div>
        <div class="footer-text">
          <p class="footer-created">Created by</p>
          <p class="footer-name">Liu, Peng</p>
        </div>
      </div>
    </main>

    <script>
      const form    = document.getElementById('login-form');
      const errEl   = document.getElementById('login-error');
      const btnLbl  = document.getElementById('btn-label');
      const btnSpin = document.getElementById('btn-spinner');
      const btn     = document.getElementById('btn-login');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errEl.classList.add('hidden');
        btn.disabled = true;
        btnLbl.textContent = '登入中…';
        btnSpin.classList.remove('hidden');

        const username = document.getElementById('inp-username').value.trim();
        const password = document.getElementById('inp-password').value;

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
          });
          const data = await res.json();

          if (res.ok && data.status === 'ok') {
            // 登入成功 → 依角色跳轉
            if (data.role === 'admin') {
              window.location.href = '/dashboard';
            } else {
              window.location.href = '/demo';
            }
          } else {
            errEl.textContent = data.message || '帳號或密碼錯誤';
            errEl.classList.remove('hidden');
            btn.disabled = false;
            btnLbl.textContent = '登入';
            btnSpin.classList.add('hidden');
          }
        } catch (err) {
          errEl.textContent = '網路錯誤，請稍後再試';
          errEl.classList.remove('hidden');
          btn.disabled = false;
          btnLbl.textContent = '登入';
          btnSpin.classList.add('hidden');
        }
      });
    </script>
  </body>
</html>
